# Single source of truth for brand + SEO rules on crownseoagency.com.
# Read by scripts/seo_lint.py (CI gate), scripts/publish_content.py, and by
# any AI assistant editing this repo (see CLAUDE.md / AGENTS.md).
#
# ⚠️ Values marked TODO are assumptions — confirm them once, then every page
#    and post is checked against them automatically.

site:
  name: Crown SEO Agency            # TODO: confirm exact brand spelling
  url: https://crownseoagency.com
  trailing_slash: true             # internal links must end with "/" (WordPress default)
  locale: en-US                    # TODO: en-GB / en-IN etc. if you target another market

# Which SEO plugin stores title/description. Determines the meta keys written.
#   rank_math | yoast | none
seo_plugin: rank_math              # TODO: confirm (wp-admin -> Plugins)

# Title pattern the SEO title should follow. "{primary}" is a hint only;
# the linter checks the brand suffix and length, not exact wording.
title_suffix: " | Crown SEO Agency"

limits:
  seo_title:        { min: 30, max: 60 }
  seo_description:  { min: 120, max: 158 }
  slug_max: 60
  post_min_words: 800
  page_min_words: 300
  post_min_internal_links: 3
  page_min_internal_links: 2

# Brand spelling consistency: any variant on the left is flagged.
brand_variants_to_avoid:
  - CrownSEO Agency
  - Crown Seo Agency
  - CrownSEOAgency
  - Crown SEO agency

# Phrases that hurt trust or violate Google's guidance for SEO providers
# (Google explicitly warns about guaranteed rankings).
banned_phrases:
  - guaranteed rankings
  - "guarantee #1"
  - "guaranteed #1"
  - "#1 on Google guaranteed"
  - instant results
  - 100% guaranteed
  - cheap seo
  - in today's digital landscape
  - in today's fast-paced world
  - unlock the power of
  - delve into
  - game-changer
