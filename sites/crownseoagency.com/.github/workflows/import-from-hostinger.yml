name: Import code from Hostinger (one-time bootstrap)

# Pulls the CURRENT live site code OFF Hostinger and commits it into this repo,
# so you can start version-controlling what is already running in production.
#
# Run it manually once (Actions tab -> "Import code from Hostinger" -> Run
# workflow), after you have set the same secrets used by deploy.yml. It commits
# to the branch you choose (default: research) so you can review the import as a
# PR before it ever becomes the source of truth for deploys.
#
# This requires SSH access. If your plan is FTP-only, use the File Manager /
# FTP import route described in docs/SETUP.md instead.

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to commit the imported code to
        default: research
        required: true

concurrency:
  group: import-from-hostinger
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H \
            "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull site code from Hostinger
        run: |
          rsync -avz \
            --exclude-from='deploy-exclude.txt' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_REMOTE_PATH }}/" \
            ./

      - name: Commit imported code
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import - repo already matches the server."
          else
            git commit -m "Import live site code from Hostinger"
            git push origin "HEAD:${{ github.event.inputs.target_branch }}"
          fi
