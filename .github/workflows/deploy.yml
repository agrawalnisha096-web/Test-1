name: Deploy to Hostinger

# Deploys the site to Hostinger over SSH using rsync.
#
# Trigger: every push to the production branch (see `branches` below), plus a
# manual "Run workflow" button. Development happens on feature branches -> PR ->
# review -> merge to the production branch -> this workflow deploys.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   HOSTINGER_SSH_HOST      e.g. 123.45.67.89  (or your server hostname)
#   HOSTINGER_SSH_USER      e.g. u123456789
#   HOSTINGER_SSH_PORT      Hostinger SSH is usually 65002 (NOT 22)
#   HOSTINGER_SSH_KEY       the PRIVATE key whose public half is added in hPanel
#   HOSTINGER_REMOTE_PATH   absolute path to deploy into,
#                           e.g. /home/u123456789/domains/jsonformatterpro.com/public_html
#
# See docs/SETUP.md for how to obtain each of these.

on:
  push:
    branches:
      - main   # <-- change to your production branch if it isn't "main"
  workflow_dispatch:

# Never let two deploys run at once against production.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H \
            "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          rsync -avz \
            --exclude-from='deploy-exclude.txt' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            ./ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_REMOTE_PATH }}/"
          # NOTE: `--delete` is intentionally NOT set, so files that exist on the
          # server but not in Git (e.g. user uploads) are left untouched. Once you
          # are confident the repo is the full source of truth, you can add
          # `--delete` to make the server an exact mirror of the repo.

      - name: Done
        run: echo "Deployed commit $GITHUB_SHA to Hostinger."
